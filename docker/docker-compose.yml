name: smart-parking

x-server-build: &server-build
  context: ..
  dockerfile: docker/server.Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: smart_parking
      POSTGRES_PASSWORD: ${DB_PASSWORD_DOCKER:-smart_parking}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_parking -d smart_parking"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  model:
    build: *server-build
    image: smart-parking-server
    working_dir: /app/MODEL_SERVER
    command: python server.py
    environment:
      MODEL_SERVER_HOST: 0.0.0.0
      MODEL_SERVER_PORT: "8001"
    restart: unless-stopped

  django:
    build: *server-build
    image: smart-parking-server
    working_dir: /app/DJANGO_SERVER
    command: sh -c "python manage.py migrate --noinput && uvicorn smart_parking.asgi:application --host 0.0.0.0 --port 8000"
    env_file:
      - path: ../.env
        format: raw
    environment:
      REDIS_HOST: redis
      MODEL_SERVER_URL: http://model:8001
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: smart_parking
      DB_USER: smart_parking
      DB_PASSWORD: ${DB_PASSWORD_DOCKER:-smart_parking}
      DB_SSLMODE: disable
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ../server/DJANGO_SERVER/parking/Spots:/app/DJANGO_SERVER/parking/Spots
      - ../server/DJANGO_SERVER/cropped_spots:/app/DJANGO_SERVER/cropped_spots
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      model:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - django
    restart: unless-stopped

volumes:
  db-data:
